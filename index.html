<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }

    .container {
      background-color: #d6f5d6;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #taskInput {
      width: 70%;
      padding: 8px;
      margin-right: 5px;
    }

    #addBtn {
      padding: 9px 15px;
      background-color: #00b894;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #fff;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }

    .task.done span {
      text-decoration: line-through;
      color: gray;
    }

    .task-left {
      display: flex;
      align-items: center;
    }

    .task input[type="checkbox"] {
      margin-right: 10px;
    }

    .delete-btn {
      background-color: #d63031;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    </style>
</head>
<body>
    <div class="container">
        <h2>TODO List</h2>
        <div>
            <input type="text" id="taskInput" placeholder="Нове завдання...">
            <button id="addBtn">Додати</button>
        </div>
        <div id="taskList"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
